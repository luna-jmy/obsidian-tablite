name: Release

# Tag filters are glob patterns, not regexes: "[0-9]+.[0-9]+.[0-9]+" never
# matches "0.4.2" because "+" is a literal character there. Match every tag
# and validate the shape below instead, so a mistyped tag fails loudly rather
# than silently skipping the release.
on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.4.2 (must match manifest.json)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: mkdir -p release && cp main.js manifest.json styles.css release/

      - name: Resolve and verify version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::A release needs an x.y.z version, got '${version}'"
            exit 1
          fi
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [ "$version" != "$manifest_version" ]; then
            echo "::error::Version ${version} does not match manifest.json (${manifest_version})"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        id: changelog
        run: |
          delimiter="$(openssl rand -hex 8)"
          {
            echo "BODY<<${delimiter}"
            awk "/^## ${{ steps.version.outputs.VERSION }}/{found=1; next} /^## /{found=0} found{print}" CHANGELOG.md
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          body: ${{ steps.changelog.outputs.BODY }}
          files: |
            release/main.js
            release/manifest.json
            release/styles.css
